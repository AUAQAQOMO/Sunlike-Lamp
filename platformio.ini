; ============================================================================
; Sunlike 双色温台灯驱动板固件
;   主控 : ESP32-C3-MINI-1U-H4 (4MB Flash)
;   驱动 : 2 x LGS63042EP 升压恒流（数字 PWM 调光，EN 引脚）
;   框架 : Arduino (arduino-esp32 2.0.17)，使用 ESP-IDF 的 LEDC 硬件渐隐接口
;
; 说明：选用 espressif32@6.9.0（内置 arduino-esp32 2.0.17）是为了与
;       点灯科技 blinker 库保持最佳兼容性。所有 LEDC 访问都封装在
;       src/pwm_hal.cpp 中，如需升级到 arduino-esp32 3.x，只需改这一个文件。
; ============================================================================
[env:esp32-c3-devkitm-1]
platform  = espressif32@6.9.0
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv  ; 双 OTA 分区各 1.875MB，固件余量更充足

; 板子默认把 Serial 映射到 USB-CDC，但本驱动板的 USB 口用于 PD 诱骗，
; 日志与烧写走 UART0（GPIO20/21，板上 CONNECTOR 的 TX/RX 排针）
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; 点灯科技 blinker 不在 PlatformIO 官方库索引里，必须用 GitHub 地址安装
lib_deps =
    https://github.com/blinker-iot/blinker-library.git
