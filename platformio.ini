; ============================================================================
; Sunlike 双色温台灯驱动板固件（ESP32-C3）
;   主控 : ESP32-C3-MINI-1U-H4 (4MB Flash)
;   驱动 : 2 x LGS63042EP 升压恒流（数字 PWM 调光，EN 引脚）
;   云端 : 巴法云 MQTT（米家/小爱）+ AP 配网 + ArduinoOTA
;   框架 : Arduino (arduino-esp32 2.0.17)
;
; 说明：所有 LEDC 访问都封装在 src/pwm_hal.cpp 中，如需升级到
;       arduino-esp32 3.x，只需改这一个文件。
; ============================================================================
[env:esp32-c3-devkitm-1]
platform  = espressif32@6.9.0
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

; 无线升级：需要 OTA 时把下面三行取消注释（IP 换成设备实际地址）
; upload_protocol = espota
; upload_port    = sunlike-lamp.local
; upload_flags   = --auth=sunlike2026

board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv  ; 双 OTA 分区各 1.875MB，固件余量更充足

; 板子默认把 Serial 映射到 USB-CDC，但本驱动板的 USB 口用于 PD 诱骗，
; 日志与烧写走 UART0（GPIO20/21，板上 CONNECTOR 的 TX/RX 排针）
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; 巴法云接入：MQTT 客户端 + JSON 解析（AP 配网协议要用 JSON）
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
