; ============================================================================
; 无线旋钮控制器（ESP32-C3）—— 独立工程
;
; 硬件：ESP32-C3-MINI-1U-H4 + EC11 + TP4056 + ME6211 LDO + 1S 锂电
; 通信：ESP-NOW 与台灯本体配对，发送「增量命令」
; 交互：与台灯本体一致（旋转调亮度 / 按住旋转调色温 / 单击开关 / 长按 5s 清配对）
;
; 注意：本板 USB-C 只供电（CC 5.1k 下拉，DP/DM 未接 MCU），
;       烧写与日志走 UART0（板上 H1 排针 VCC/RXD0/TXD0/GND），
;       进下载模式需按住 BOOT 再点 RST。
; ============================================================================
[env:esp32-c3-devkitm-1]
platform  = espressif32@6.9.0
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 460800

board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv

build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; 纯 ESP-NOW，不需要 MQTT / JSON 库
lib_deps =
